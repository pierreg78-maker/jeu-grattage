<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>L'Archéologue du Temps - Jeu à Gratter</title>
    <style>
        :root {
            --color-s1: #e6c280;
            --color-s2: #bc6c25;
            --color-s3: #8b4513;
            --color-s4: #654321;
            --color-s5: #4a3525;
            --color-s6: #111111;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f4f4f9;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: 1.3rem;
            margin: 6px 0 2px 0;
            color: #e6c280;
            text-align: center;
        }

        .instructions {
            font-size: 0.75rem;
            color: #ccc;
            text-align: center;
            max-width: 400px;
            margin-bottom: 8px;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .strate-wrapper {
            position: relative;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            border: 2px solid #444;
        }

        .strate-wrapper.bloquee {
            opacity: 0.35;
            filter: grayscale(80%);
            pointer-events: none;
        }

        /* Couleurs des 6 strates en fond */
        .strate-wrapper:nth-child(1) { background-color: var(--color-s1); }
        .strate-wrapper:nth-child(2) { background-color: var(--color-s2); }
        .strate-wrapper:nth-child(3) { background-color: var(--color-s3); }
        .strate-wrapper:nth-child(4) { background-color: var(--color-s4); }
        .strate-wrapper:nth-child(5) { background-color: var(--color-s5); }
        .strate-wrapper:nth-child(6) { background-color: var(--color-s6); }

        .contenu-strate {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 10px;
            box-sizing: border-box;
            z-index: 1;
        }

        .chrono-label {
            font-size: 0.7rem;
            font-weight: bold;
            color: #000;
            background: rgba(255,255,255,0.9);
            padding: 3px 6px;
            border-radius: 4px;
            width: 75px;
            text-align: center;
            flex-shrink: 0;
            margin-right: 15px;
        }

        .elements-box {
            font-size: 1.2rem;
            letter-spacing: 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-grow: 1;
            padding-right: 10px;
        }

        canvas.scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: crosshair;
            touch-action: none;
        }

        .feedback-sonore {
            font-size: 0.75rem;
            font-style: italic;
            color: #ffeb3b;
            min-height: 16px;
            text-align: center;
            margin-top: 6px;
            font-weight: bold;
        }

        .panneau-score {
            margin-top: 6px;
            padding: 6px 12px;
            background: #2a2a2a;
            border-radius: 6px;
            border: 1px solid #444;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        .btn {
            background-color: #bc6c25;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            width: 100%;
            max-width: 420px;
            font-weight: bold;
        }

        .btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>L'Archéologue du Temps</h1>
    <div class="instructions">
        Choisis une strate et frotte pour la gratter. 3 coups de pioche max.
    </div>

    <div class="game-container" id="gameContainer">
        <!-- Généré dynamiquement -->
    </div>

    <div class="feedback-sonore" id="feedbackSonore">Appuie sur un ticket pour commencer...</div>

    <div class="panneau-score">
        Coups restants : <span id="coupsRestants">3</span> | Gain : <span id="gainActuel">0</span> 🪙
    </div>

    <button class="btn" id="btnNouveauTicket" onclick="initialiserJeu()">Nouveau ticket. 1 🪙</button>

    <script>
        const anneesStrates = ["-1 000", "-2 000", "-3 000", "-4 000", "-5 000", "-6 000"];
        const emoticonsAmbiance = ["🐚", "☠️", "💀", "🦴", "⚰️", "🏺", "⚱️"];

        let coupsRestants = 3;
        let gainTotal = 0;
        let partieTerminee = false;
        let stratesData = [];
        let activeStrateIndex = null;

        function initialiserJeu() {
            coupsRestants = 3;
            gainTotal = 0;
            partieTerminee = false;
            activeStrateIndex = null;
            document.getElementById('coupsRestants').textContent = coupsRestants;
            document.getElementById('gainActuel').textContent = gainTotal;
            document.getElementById('feedbackSonore').textContent = "Grattes une strate argentée (1 seule à la fois)...";
            document.getElementById('btnNouveauTicket').disabled = true;

            // 1. Placement du Diamant (augmenté à 20% de chance pour plus de frissons)
            let indexDiamant = Math.random() < 0.20 ? Math.floor(Math.random() * 6) : -1;

            // 2. Répartition généreuse des pièces d'or (plus de gains pour s'amuser)
            let totalPieces = Math.floor(Math.random() * 5) + 3; // Entre 3 et 7 pièces par ticket
            let distributionPieces = new Array(6).fill(0);
            for (let i = 0; i < totalPieces; i++) {
                distributionPieces[Math.floor(Math.random() * 6)]++;
            }

            // 3. Construction des strates (3 à 7 émojis par strate au total)
            stratesData = [];
            for (let i = 0; i < 6; i++) {
                let itemsStrate = [];
                let valeurStr = 0;
                let nbA = Math.floor(Math.random() * 3) + 2; // 2 à 4 émojis d'ambiance

                for(let a = 0; a < nbA; a++) {
                    let emo = emoticonsAmbiance[Math.floor(Math.random() * emoticonsAmbiance.length)];
                    itemsStrate.push(emo);
                }

                if (i === indexDiamant) {
                    itemsStrate.push("💎");
                    valeurStr += 10;
                }

                let nbP = distributionPieces[i];
                for(let p = 0; p < nbP; p++) {
                    itemsStrate.push("🪙");
                    valeurStr += 1;
                }

                itemsStrate.sort(() => Math.random() - 0.5);

                stratesData.push({
                    annee: anneesStrates[i] + " ans",
                    items: itemsStrate.join(" "),
                    valeur: valeurStr,
                    aDiamant: i === indexDiamant,
                    aPieces: nbP > 0,
                    decouverte: false
                });
            }

            afficherGrille();
        }

        function afficherGrille() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = "";

            stratesData.forEach((data, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'strate-wrapper';
                wrapper.id = `wrapper-${index}`;

                wrapper.innerHTML = `
                    <div class="contenu-strate">
                        <span class="chrono-label">${data.annee}</span>
                        <span class="elements-box">${data.items}</span>
                    </div>
                    <canvas class="scratch-canvas" id="canvas-${index}"></canvas>
                `;
                container.appendChild(wrapper);

                setTimeout(() => initialiserCanvasGrattage(index), 50);
            });
            mettreAJourBlocage();
        }

        function initialiserCanvasGrattage(index) {
            const canvas = document.getElementById(`canvas-${index}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            // Remplir avec la couche grise argentée unie
            ctx.fillStyle = '#b8b8b8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Texture rayée discrète
            ctx.fillStyle = '#a0a0a0';
            for(let i = 0; i < canvas.width; i += 14) {
                ctx.fillRect(i, 0, 5, canvas.height);
            }

            let isDrawing = false;

            function getMousePos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function scratch(e) {
                if (partieTerminee || coupsRestants <= 0 || stratesData[index].decouverte) return;
                
                if (activeStrateIndex !== null && activeStrateIndex !== index) return;

                if (activeStrateIndex === null) {
                    activeStrateIndex = index;
                    mettreAJourBlocage();
                }

                const pos = getMousePos(e);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2);
                ctx.fill();

                if (Math.random() < 0.2) {
                    document.getElementById('feedbackSonore').textContent = "Frrrr frrrr... ⛏️";
                }

                const currentAlphaData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let transparentPixels = 0;
                for (let i = 3; i < currentAlphaData.length; i += 16) {
                    if (currentAlphaData[i] < 128) transparentPixels++;
                }
                if ((transparentPixels / (currentAlphaData.length / 16)) > 0.40) {
                    validerDecouverteStrate(index);
                }
            }

            canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
            window.addEventListener('mousemove', (e) => { if (isDrawing) scratch(e); });
            window.addEventListener('mouseup', () => { isDrawing = false; });

            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); e.preventDefault(); });
            window.addEventListener('touchmove', (e) => { if (isDrawing) scratch(e); }, { passive: false });
            window.addEventListener('touchend', () => { isDrawing = false; });
        }

        function validerDecouverteStrate(index) {
            if (stratesData[index].decouverte) return;
            stratesData[index].decouverte = true;

            const canvas = document.getElementById(`canvas-${index}`);
            if (canvas) canvas.remove();

            gainTotal += stratesData[index].valeur;
            document.getElementById('gainActuel').textContent = gainTotal;

            if (stratesData[index].aDiamant) {
                document.getElementById('feedbackSonore').textContent = "💎 Cling cling cling ! DIAMANT ! (+10 🪙)";
            } else if (stratesData[index].aPieces) {
                document.getElementById('feedbackSonore').textContent = "🪙 Cling ! Pièce(s) trouvée(s) !";
            } else {
                document.getElementById('feedbackSonore').textContent = "🦴 Rien de précieux ici...";
            }

            coupsRestants--;
            document.getElementById('coupsRestants').textContent = coupsRestants;

            activeStrateIndex = null;
            mettreAJourBlocage();

            if (coupsRestants === 0 || verifierToutesDecouvertes()) {
                terminerPartie();
            }
        }

        function verifierToutesDecouvertes() {
            return stratesData.every(d => d.decouverte);
        }

        function mettreAJourBlocage() {
            stratesData.forEach((data, i) => {
                const wrapper = document.getElementById(`wrapper-${i}`);
                if (!wrapper) return;
                if (data.decouverte) {
                    wrapper.classList.add('bloquee');
                } else if (activeStrateIndex !== null && activeStrateIndex !== i) {
                    wrapper.classList.add('bloquee');
                } else {
                    wrapper.classList.remove('bloquee');
                }
            });
        }

        function terminerPartie() {
            partieTerminee = true;
            stratesData.forEach((_, i) => {
                const canvas = document.getElementById(`canvas-${i}`);
                if (canvas) canvas.remove();
            });

            document.getElementById('feedbackSonore').textContent = gainTotal > 0 ? `🎉 Terminé ! Gain total : +${gainTotal} 🪙` : "😢 Terminé, pas de gain ce coup-ci.";
            document.getElementById('btnNouveauTicket').disabled = false;
        }

        window.onload = initialiserJeu;
    </script>
</body>
</html>
