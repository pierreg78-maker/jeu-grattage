<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trésor des Âges</title>
  <style>
    :root {
      --or: #e6c280;
      --cuivre: #bc6c25;
      --fond: #171411;
      --panneau: #28231e;
      --texte: #f8f1e5;
      --s1: #dfc18b;
      --s2: #bd7a3f;
      --s3: #925127;
      --s4: #6e4028;
      --s5: #49372d;
      --s6: #201d1b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(188,108,37,.18), transparent 38%),
        var(--fond);
      color: var(--texte);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      min-height: 100vh;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      color: var(--or);
      text-align: center;
      margin: 4px 0 2px;
      letter-spacing: .03em;
    }

    .sous-titre {
      color: #d8cbb9;
      font-size: .78rem;
      text-align: center;
      margin: 0 0 10px;
    }

    .barre-haute,
    .game-container,
    .panneau-score,
    .musee {
      width: 100%;
      max-width: 430px;
    }

    .barre-haute {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .progression {
      background: #28231e;
      border: 1px solid #51483f;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: .8rem;
    }

    .progression strong { color: var(--or); }

    .btn-musee {
      border: 1px solid #d1aa62;
      background: linear-gradient(#5d4328, #3b2c1e);
      color: #fff5d8;
      border-radius: 10px;
      min-height: 42px;
      padding: 7px 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .strate-wrapper {
      position: relative;
      height: 66px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.16);
      box-shadow: inset 0 3px 8px rgba(0,0,0,.42), 0 2px 5px rgba(0,0,0,.25);
      transition: opacity .2s, transform .2s;
    }

    .strate-wrapper:nth-child(1) { background: var(--s1); }
    .strate-wrapper:nth-child(2) { background: var(--s2); }
    .strate-wrapper:nth-child(3) { background: var(--s3); }
    .strate-wrapper:nth-child(4) { background: var(--s4); }
    .strate-wrapper:nth-child(5) { background: var(--s5); }
    .strate-wrapper:nth-child(6) { background: var(--s6); }

    .strate-wrapper.bloquee {
      opacity: .33;
      filter: grayscale(.75);
      pointer-events: none;
    }

    .strate-wrapper.decouverte {
      opacity: 1;
      filter: none;
      border-color: rgba(230,194,128,.65);
    }

    .contenu-strate {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  grid-template-columns: 92px 1fr;
  align-items: stretch;
  padding: 0;
}
   .chrono-label {
  position: relative;
  z-index: 4;

  width: auto;
  height: 100%;
  padding: 5px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #241a12;
  background: rgba(255, 250, 235, .96);
  border-right: 2px solid rgba(83, 57, 34, .35);

  text-align: center;
  font-size: .7rem;
  line-height: 1.15;
  font-weight: 900;
}

   .elements-box {
  position: relative;
  z-index: 1;

  min-width: 0;
  display: flex;
  justify-content: space-evenly;
  align-items: center;

  padding: 0 8px;
  font-size: 1.35rem;
  gap: 4px;
}

   canvas.scratch-canvas {
  position: absolute;
  z-index: 2;

  top: 0;
  right: 0;
  bottom: 0;
  left: 92px;

  width: calc(100% - 92px);
  height: 100%;

  cursor: crosshair;
  touch-action: none;
}

    .feedback {
      width: 100%;
      max-width: 430px;
      min-height: 42px;
      margin: 8px 0 5px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffe88a;
      font-size: .82rem;
      font-weight: 800;
    }

    .panneau-score {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--panneau);
      border: 1px solid #51483f;
      border-radius: 10px;
      padding: 9px;
      text-align: center;
      font-size: .85rem;
    }

    .panneau-score strong {
      display: block;
      color: var(--or);
      font-size: 1.05rem;
      margin-top: 2px;
    }

    .btn {
      width: 100%;
      max-width: 430px;
      margin-top: 8px;
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      background: linear-gradient(#d0833e, #a75b1e);
      color: white;
      font-size: .95rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 #6d3514;
    }

    .btn:disabled {
      background: #45413d;
      box-shadow: none;
      color: #918c86;
      cursor: not-allowed;
    }

    .musee {
      display: none;
      margin-top: 10px;
      background: #f4ead6;
      color: #34261b;
      border: 3px solid #8c6435;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 26px rgba(0,0,0,.36);
    }

    .musee.ouvert { display: block; }

    .musee h2 {
      margin: 0 0 3px;
      text-align: center;
      font-family: Georgia, serif;
      color: #68431f;
    }

    .musee p {
      margin: 0 0 10px;
      text-align: center;
      font-size: .76rem;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .objet {
      min-height: 92px;
      border: 1px solid #cbb692;
      background: rgba(255,255,255,.48);
      border-radius: 9px;
      padding: 7px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .objet .icone { font-size: 1.75rem; }
    .objet .nom { font-size: .68rem; font-weight: 900; margin-top: 4px; }
    .objet .rarete { font-size: .58rem; color: #7d5e3d; margin-top: 2px; }

    .objet.inconnu .icone {
      filter: grayscale(1) brightness(.25);
      opacity: .28;
    }

    .objet.inconnu .nom { color: #8b8175; }

    .objet.nouveau {
      animation: pulseObjet .85s ease 2;
      outline: 3px solid #f5c344;
    }

    @keyframes pulseObjet {
      50% { transform: scale(1.06); background: #fff2b7; }
    }

    .decouverte-popup {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      place-items: center;
      background: rgba(8, 6, 4, .82);
      padding: 14px;
    }

    .decouverte-popup.visible { display: grid; }

    .carte-decouverte {
      position: relative;
      width: min(900px, 96vw);
      min-height: min(570px, 84vh);
      overflow: hidden;
      border: 3px solid rgba(230, 194, 128, .78);
      border-radius: 18px;
      background:
        linear-gradient(90deg, rgba(0,0,0,.10) 0 37%, rgba(0,0,0,.76) 58%, rgba(0,0,0,.88) 100%),
        url("https://raw.githubusercontent.com/pierreg78-maker/AtelierMemo-Assets/main/assets/personnages/Archibald_popup.jpg") center / cover no-repeat;
      box-shadow: 0 18px 70px rgba(0,0,0,.72);
      animation: apparition .28s ease-out;
    }

    @keyframes apparition {
      from { transform: scale(.92); opacity: 0; }
    }

    .contenu-archibald {
      position: relative;
      z-index: 1;
      width: 58%;
      min-height: min(570px, 84vh);
      margin-left: auto;
      padding: clamp(22px, 4vw, 44px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      color: #fff;
      text-align: left;
      text-shadow: 0 2px 4px rgba(0,0,0,.9);
    }

    .archibald-exclamation {
      margin: 0 0 10px;
      color: #ffe2a2;
      font: 900 clamp(1.35rem, 3.1vw, 2rem)/1.1 Georgia, serif;
    }

    .carte-decouverte h3 {
      margin: 0 0 14px;
      color: #fff;
      font: 900 clamp(1.3rem, 3vw, 1.9rem)/1.15 Georgia, serif;
    }

    .carte-decouverte .badge {
      display: inline-block;
      margin: 0 0 14px;
      padding: 5px 10px;
      border: 1px solid rgba(255,226,162,.65);
      border-radius: 99px;
      background: rgba(72,45,20,.76);
      color: #ffe8b2;
      font-size: .72rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .carte-decouverte p {
      margin: 0 0 22px;
      font-size: clamp(.96rem, 2.2vw, 1.28rem);
      line-height: 1.45;
      font-weight: 750;
    }

    .petit-btn {
      align-self: flex-end;
      border: 1px solid #f6d387;
      border-radius: 10px;
      padding: 11px 17px;
      background: linear-gradient(#b8792f, #7a4518);
      color: white;
      font-size: .94rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }

    @media (max-width: 650px) {
      .carte-decouverte {
        min-height: min(650px, 88vh);
        background:
          linear-gradient(0deg, rgba(0,0,0,.90) 0 49%, rgba(0,0,0,.12) 78%),
          url("https://raw.githubusercontent.com/pierreg78-maker/AtelierMemo-Assets/main/assets/personnages/Archibald_popup.jpg") 30% center / cover no-repeat;
      }

      .contenu-archibald {
        width: 100%;
        min-height: min(650px, 88vh);
        padding: 20px;
        justify-content: flex-end;
      }

      .archibald-exclamation { margin-bottom: 5px; }
      .carte-decouverte h3 { margin-bottom: 7px; }
      .carte-decouverte .badge { margin-bottom: 8px; }
      .carte-decouverte p { margin-bottom: 14px; line-height: 1.35; }
      .petit-btn { align-self: stretch; }
    }

    .reset {
      display: block;
      margin: 12px auto 0;
      border: 0;
      background: transparent;
      color: #8c6a48;
      text-decoration: underline;
      font-size: .68rem;
      cursor: pointer;
    }

    .retour {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      background: linear-gradient(#2d73c7, #1b4f97);
      color: white;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 5px 12px rgba(30, 74, 117, .22);
    }

  </style>
</head>
<body>
  <h1>🏺 Le Trésor des Âges</h1>
  <p class="sous-titre">Chez le Professeur Archibald</p>

  <div class="barre-haute">
    <div class="progression">
      Collection : <strong><span id="objetsTrouves">0</span>/<span id="objetsTotal">0</span></strong>
    </div>
    <button class="btn-musee" id="btnMusee">🏛️ Mon musée</button>
  </div>

  <div class="game-container" id="gameContainer"></div>

  <div class="feedback" id="feedbackSonore">
    Choisis une strate et commence les fouilles…
  </div>

  <div class="panneau-score">
    <div>Coups restants<strong id="coupsRestants">3</strong></div>
    <div>Gain du ticket<strong><span id="gainActuel">0</span> 🪙</strong></div>
  </div>

  <button class="btn" id="btnNouveauTicket">Nouveau ticket · 1 🪙</button>

  <section class="musee" id="musee">
    <h2>Le musée du Village</h2>
    <p>Les objets découverts sont conservés sur cet appareil.</p>
    <div class="collection-grid" id="collectionGrid"></div>
    <button class="reset" id="btnResetCollection">Réinitialiser la collection</button>
  </section>

  <div class="decouverte-popup" id="popup">
    <div class="carte-decouverte" role="dialog" aria-modal="true" aria-labelledby="popupNom">
      <div class="contenu-archibald">
        <div class="archibald-exclamation" id="popupExclamation">Merveilleux !</div>
        <h3 id="popupNom"></h3>
        <div class="badge" id="popupRarete"></div>
        <p id="popupDescription"></p>
        <button class="petit-btn" id="btnFermerPopup">Continuer les fouilles ✨</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/pierreg78-maker/village@main/village.js"></script>
  <script>
    const anneesStrates = ["-1 000", "-2 000", "-3 000", "-4 000", "-5 000", "-6 000"];
    const emoticonsAmbiance = ["🐚", "🪨", "🦴", "🔥", "⚱️", "🧱", "🌿"];

    const catalogueObjets = [
      { id: "vase-gaulois", icone: "🏺", nom: "Vase gaulois", rarete: "Commun", description: "Les vases gaulois en céramique servaient à conserver le vin, la bière ou les grains. Certains portaient des motifs géométriques ou animaliers typiques de l’art celtique." },
      { id: "urne-funeraire", icone: "⚱️", nom: "Urne funéraire", rarete: "Commun", description: "Utilisées dès le Néolithique, les urnes funéraires contenaient les cendres des défunts. Chez les Étrusques et les Romains, certaines étaient richement décorées." },
      { id: "fragment-poutre", icone: "🪵", nom: "Fragment de poutre", rarete: "Commun", description: "Les poutres de chêne médiévales révèlent des techniques de charpenterie très précises. Certaines charpentes de cathédrales ont traversé plus de huit siècles." },
      { id: "fossile-poisson", icone: "🐟", nom: "Fossile de poisson", rarete: "Commun", description: "Certains fossiles de poissons conservent encore les détails des nageoires et des écailles. Ils racontent des millions d’années d’évolution de la vie aquatique." },
      { id: "brique-romaine", icone: "🧱", nom: "Brique romaine", rarete: "Commun", description: "Les briques romaines portaient parfois le nom d’une légion ou de leur fabricant. On en retrouve encore dans les thermes, les aqueducs et les villas." },
      { id: "clochette-bronze", icone: "🔔", nom: "Clochette en bronze", rarete: "Commun", description: "Les clochettes en bronze servaient aux rituels, aux troupeaux ou à la signalisation. Leur son clair pouvait porter à grande distance." },
      { id: "astrolabe", icone: "🧭", nom: "Astrolabe", rarete: "Rare", description: "Perfectionné par les savants arabes au IXe siècle, l’astrolabe mesurait la hauteur des étoiles. Il aidait aussi les voyageurs et les navigateurs à s’orienter." },
      { id: "bague-marchand", icone: "💍", nom: "Bague du marchand", rarete: "Rare", description: "Au Moyen Âge, les marchands utilisaient des bagues-sceaux gravées de leur marque. Elles permettaient d’authentifier contrats et lettres sans signature manuscrite." },
      { id: "pointe-fleche", icone: "🏹", nom: "Pointe de flèche", rarete: "Rare", description: "Les pointes de flèche en silex témoignent déjà d’une taille très précise il y a environ 20 000 ans. Le fer et l’acier les rendirent ensuite plus résistantes." },
      { id: "cle-medievale", icone: "🗝️", nom: "Clé médiévale", rarete: "Rare", description: "Les clés médiévales en fer forgé ouvraient parfois des serrures complexes. Les plus ornées symbolisaient le pouvoir ou l’accès à un précieux coffre." },
      { id: "plume-ecriture", icone: "🪶", nom: "Plume d’écriture", rarete: "Rare", description: "Les plumes d’oie dominèrent l’écriture européenne pendant plus de mille ans. Elles devaient être retaillées régulièrement et utilisées avec une encre adaptée." },
      { id: "lampe-huile", icone: "🕯️", nom: "Lampe à huile", rarete: "Rare", description: "Les lampes à huile romaines brûlaient souvent de l’huile d’olive. Leur faible lumière éclairait les maisons, les déplacements nocturnes et les cérémonies." },
      { id: "collier-princier", icone: "📿", nom: "Collier princier", rarete: "Très rare", description: "Le collier de la tombe de Vix, en or et en corail, pesait près d’un kilo. Il appartenait probablement à une princesse celte du VIe siècle avant notre ère." },
      { id: "sceau-royal", icone: "⚜️", nom: "Sceau royal", rarete: "Très rare", description: "Les grands sceaux authentifiaient officiellement les actes royaux. Leur matrice était jalousement gardée, puis souvent brisée à chaque changement de règne." },
      { id: "bouclier-grave", icone: "🛡️", nom: "Bouclier gravé", rarete: "Très rare", description: "Le bouclier de Battersea, découvert dans la Tamise, illustre le raffinement de l’art celtique. Trop décoré pour la bataille, il était probablement cérémoniel." },
      { id: "codex-enlumine", icone: "📖", nom: "Codex enluminé", rarete: "Très rare", description: "Le Livre de Kells est un manuscrit irlandais décoré d’or et de pigments rares. Ses pages comptent parmi les chefs-d’œuvre de l’art médiéval." },
      { id: "croix-orfevre", icone: "⛪", nom: "Croix d’orfèvre", rarete: "Très rare", description: "La croix de Cong, en bronze doré et cristaux de roche, était portée lors des processions. Elle témoigne du talent des orfèvres monastiques médiévaux." },
      { id: "couronne-empereur", icone: "👑", nom: "Couronne de l’Empereur", rarete: "Légendaire", description: "La Couronne du Saint-Empire servit au sacre de nombreux empereurs germaniques. Conservée à Vienne, elle reste un puissant symbole du pouvoir impérial." },
      { id: "cristal-ages", icone: "💠", nom: "Cristal des Âges", rarete: "Légendaire", description: "Selon une légende du Village, ce cristal conserverait la mémoire des civilisations disparues. Aucun archéologue n’a pourtant réussi à l’identifier avec certitude." },
      { id: "idole-oubliee", icone: "🗿", nom: "Idole oubliée", rarete: "Légendaire", description: "La Vénus de Willendorf, vieille d’environ 27 000 ans, compte parmi les plus anciennes figurines féminines connues. Sa signification demeure mystérieuse." },
      { id: "tresor-temple", icone: "⚱️", nom: "Trésor du Temple", rarete: "Légendaire", description: "Le trésor du Temple de Jérusalem fut emporté par les Romains en 70 de notre ère. Une partie aurait été montrée à Rome lors du triomphe de Titus." }
    ];

    const exclamationsArchibald = [
      "🤩 Merveilleux !",
      "🔎 Regardez ça !",
      "🏺 Fascinant !",
      "✨ Quelle découverte !",
      "👏 Excellent !",
      "😮 Incroyable !",
      "📜 Remarquable !",
      "🧭 Voilà qui est passionnant !"
    ];

    const poidsRarete = [
      { rarete: "Commun", poids: 58 },
      { rarete: "Rare", poids: 29 },
      { rarete: "Très rare", poids: 11 },
      { rarete: "Légendaire", poids: 2 }
    ];

    let coupsRestants = 3;
    let gainTotal = 0;
    let partieTerminee = false;
    let stratesData = [];
    let activeStrateIndex = null;
    let collection = chargerCollection();
    let dernierObjetNouveau = null;
    let dernierSonPioche = 0;
    let transactionEnCours = false;
    let gainEnAttente = 0;
    let ticketActif = false;

    const URL_SONS = {
      pioche: "https://raw.githubusercontent.com/pierreg78-maker/AtelierMemo-Assets/main/assets/sons/tresor_des_ages/pioche.wav",
      objet: "https://raw.githubusercontent.com/pierreg78-maker/AtelierMemo-Assets/main/assets/sons/tresor_des_ages/decouverte_objet.wav",
      tresor: "https://raw.githubusercontent.com/pierreg78-maker/AtelierMemo-Assets/main/assets/sons/tresor_des_ages/piece_tresor.wav"
    };

    const sons = {
      pioche: new Audio(URL_SONS.pioche),
      objet: new Audio(URL_SONS.objet),
      tresor: new Audio(URL_SONS.tresor)
    };

    sons.pioche.preload = "auto";
    sons.objet.preload = "auto";
    sons.tresor.preload = "auto";
    sons.pioche.volume = 0.42;
    sons.objet.volume = 0.72;
    sons.tresor.volume = 0.78;

    const $ = (id) => document.getElementById(id);

    function jouerSon(nom, { reprendreAuDebut = true } = {}) {
      const son = sons[nom];
      if (!son) return;

      try {
        if (reprendreAuDebut) son.currentTime = 0;
        const lecture = son.play();
        if (lecture && typeof lecture.catch === "function") {
          lecture.catch(() => {
            // Le navigateur peut bloquer un son avant la première interaction.
          });
        }
      } catch (erreur) {
        console.warn(`Lecture du son « ${nom} » impossible :`, erreur);
      }
    }

    function jouerPioche() {
      const maintenant = performance.now();
      if (maintenant - dernierSonPioche < 150) return;
      dernierSonPioche = maintenant;
      jouerSon("pioche");
    }

    function chargerCollection() {
      try {
        const sauvegarde = JSON.parse(localStorage.getItem("archeologue_collection") || "[]");
        return Array.isArray(sauvegarde) ? sauvegarde : [];
      } catch {
        return [];
      }
    }

    function sauvegarderCollection() {
      localStorage.setItem("archeologue_collection", JSON.stringify(collection));
    }

    function tirerRarete() {
      const total = poidsRarete.reduce((s, r) => s + r.poids, 0);
      let tirage = Math.random() * total;
      for (const ligne of poidsRarete) {
        tirage -= ligne.poids;
        if (tirage <= 0) return ligne.rarete;
      }
      return "Commun";
    }

    function tirerObjet() {
      const rarete = tirerRarete();
      const candidats = catalogueObjets.filter(o => o.rarete === rarete);
      return candidats[Math.floor(Math.random() * candidats.length)];
    }

    function creerTicket() {
      coupsRestants = 3;
      gainTotal = 0;
      partieTerminee = false;
      activeStrateIndex = null;
      dernierObjetNouveau = null;
      ticketActif = true;
      gainEnAttente = 0;

      $("coupsRestants").textContent = coupsRestants;
      $("gainActuel").textContent = gainTotal;
      $("feedbackSonore").textContent = "Gratte 100% d'une première strate argentée";
      $("btnNouveauTicket").disabled = true;
      $("btnNouveauTicket").textContent = "Fouilles en cours…";

      const indexDiamant = Math.random() < 0.20 ? Math.floor(Math.random() * 6) : -1;

      const totalPieces = Math.floor(Math.random() * 5) + 3;
      const distributionPieces = new Array(6).fill(0);
      for (let i = 0; i < totalPieces; i++) {
        distributionPieces[Math.floor(Math.random() * 6)]++;
      }

      // 75 % des tickets contiennent un objet de musée, parfois deux.
      const objetsParStrate = new Array(6).fill(null);
      if (Math.random() < 0.75) {
        const premiereStrate = Math.floor(Math.random() * 6);
        objetsParStrate[premiereStrate] = tirerObjet();

        if (Math.random() < 0.12) {
          let secondeStrate;
          do {
            secondeStrate = Math.floor(Math.random() * 6);
          } while (secondeStrate === premiereStrate);
          objetsParStrate[secondeStrate] = tirerObjet();
        }
      }

      stratesData = anneesStrates.map((annee, i) => {
        const items = [];
        const nbAmbiance = Math.floor(Math.random() * 2) + 2;

        for (let a = 0; a < nbAmbiance; a++) {
          items.push(emoticonsAmbiance[Math.floor(Math.random() * emoticonsAmbiance.length)]);
        }

        const objet = objetsParStrate[i];
        if (objet) items.push(objet.icone);

        if (i === indexDiamant) items.push("💎");

        const nbPieces = distributionPieces[i];
        for (let p = 0; p < nbPieces; p++) items.push("🪙");

        melanger(items);

        return {
          annee: annee + " ans",
          items,
          valeur: nbPieces + (i === indexDiamant ? 10 : 0),
          aDiamant: i === indexDiamant,
          aPieces: nbPieces > 0,
          objet,
          decouverte: false
        };
      });

      afficherGrille();
      afficherCollection();
    }

    function melanger(tableau) {
      for (let i = tableau.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tableau[i], tableau[j]] = [tableau[j], tableau[i]];
      }
    }

    function afficherGrille() {
      const container = $("gameContainer");
      container.innerHTML = "";

      stratesData.forEach((data, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "strate-wrapper";
        wrapper.id = `wrapper-${index}`;
        wrapper.innerHTML = `
          <div class="contenu-strate">
            <span class="chrono-label">${data.annee}</span>
            <span class="elements-box">${data.items.map(i => `<span>${i}</span>`).join("")}</span>
          </div>
          <canvas class="scratch-canvas" id="canvas-${index}" aria-label="Gratter la strate ${data.annee}"></canvas>
        `;
        container.appendChild(wrapper);
        requestAnimationFrame(() => initialiserCanvasGrattage(index));
      });

      mettreAJourBlocage();
    }

    function initialiserCanvasGrattage(index) {
      const canvas = $(`canvas-${index}`);
      if (!canvas) return;

      const rect = canvas.getBoundingClientRect();
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);

      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);

      const largeur = rect.width;
      const hauteur = rect.height;
      const degrade = ctx.createLinearGradient(0, 0, largeur, hauteur);
      degrade.addColorStop(0, "#d8d8d8");
      degrade.addColorStop(.45, "#9d9d9d");
      degrade.addColorStop(.55, "#e8e8e8");
      degrade.addColorStop(1, "#a4a4a4");
      ctx.fillStyle = degrade;
      ctx.fillRect(0, 0, largeur, hauteur);

      ctx.globalAlpha = .22;
      ctx.fillStyle = "#ffffff";
      for (let x = -hauteur; x < largeur + hauteur; x += 18) {
        ctx.save();
        ctx.translate(x, 0);
        ctx.rotate(-.35);
        ctx.fillRect(0, 0, 5, hauteur * 2);
        ctx.restore();
      }
      ctx.globalAlpha = 1;

      let isDrawing = false;
      let dernierControle = 0;

      function position(e) {
        const r = canvas.getBoundingClientRect();
        const point = e.touches?.[0] || e.changedTouches?.[0] || e;
        return { x: point.clientX - r.left, y: point.clientY - r.top };
      }

      function scratch(e) {
        if (!isDrawing || !ticketActif || partieTerminee || coupsRestants <= 0 || stratesData[index].decouverte) return;
        if (activeStrateIndex !== null && activeStrateIndex !== index) return;

        if (activeStrateIndex === null) {
          activeStrateIndex = index;
          mettreAJourBlocage();
        }

        const pos = position(e);
        jouerPioche();
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 23, 0, Math.PI * 2);
        ctx.fill();

        const maintenant = performance.now();
        if (maintenant - dernierControle > 120) {
          dernierControle = maintenant;
          if (pourcentageGratte(ctx, largeur, hauteur) >= .90) {
            validerDecouverteStrate(index);
          }
        }
      }

      canvas.addEventListener("pointerdown", (e) => {
        isDrawing = true;
        canvas.setPointerCapture?.(e.pointerId);
        scratch(e);
      });

      canvas.addEventListener("pointermove", scratch);
      canvas.addEventListener("pointerup", () => { isDrawing = false; });
      canvas.addEventListener("pointercancel", () => { isDrawing = false; });
    }

    function pourcentageGratte(ctx, largeur, hauteur) {
      const pixels = ctx.getImageData(0, 0, Math.floor(largeur), Math.floor(hauteur)).data;
      let transparents = 0;
      let controles = 0;

      for (let i = 3; i < pixels.length; i += 64) {
        controles++;
        if (pixels[i] < 100) transparents++;
      }

      return controles ? transparents / controles : 0;
    }

    function validerDecouverteStrate(index) {
      const data = stratesData[index];
      if (data.decouverte) return;

      data.decouverte = true;
      $(`canvas-${index}`)?.remove();
      $(`wrapper-${index}`)?.classList.add("decouverte");

      gainTotal += data.valeur;
      $("gainActuel").textContent = gainTotal;

      if (data.objet) {
        enregistrerObjet(data.objet);
      }

      if (data.aDiamant || data.aPieces) {
        jouerSon("tresor");
      } else if (data.objet) {
        jouerSon("objet");
      }

      if (data.aDiamant) {
        $("feedbackSonore").textContent = "💎 Incroyable ! Un diamant et 10 pièces d’or !";
      } else if (data.objet && data.aPieces) {
        $("feedbackSonore").textContent = `${data.objet.icone} Une relique et ${data.valeur} pièce(s) découvertes !`;
      } else if (data.objet) {
        $("feedbackSonore").textContent = `${data.objet.icone} Une découverte pour le musée !`;
      } else if (data.aPieces) {
        $("feedbackSonore").textContent = `🪙 ${data.valeur} pièce(s) d’or trouvée(s) !`;
      } else {
        $("feedbackSonore").textContent = "🦴 Aucun trésor dans cette strate…";
      }

      coupsRestants--;
      $("coupsRestants").textContent = coupsRestants;
      activeStrateIndex = null;
      mettreAJourBlocage();

      if (coupsRestants === 0 || stratesData.every(d => d.decouverte)) {
        terminerPartie();
      }
    }

    function enregistrerObjet(objet) {
      const estNouveau = !collection.includes(objet.id);
      if (estNouveau) {
        collection.push(objet.id);
        sauvegarderCollection();
        dernierObjetNouveau = objet.id;
      }

      afficherCollection();
      montrerPopup(objet, estNouveau);
    }

    function montrerPopup(objet, estNouveau) {
      const exclamation = exclamationsArchibald[
        Math.floor(Math.random() * exclamationsArchibald.length)
      ];

      $("popupExclamation").textContent = exclamation;
      $("popupRarete").textContent = estNouveau
        ? `${objet.rarete} · Nouvelle découverte`
        : `${objet.rarete} · Déjà au musée`;
      $("popupNom").textContent = `${objet.icone} ${objet.nom}`;
      $("popupDescription").textContent = objet.description;
      $("popup").classList.add("visible");
      $("btnFermerPopup").focus();
    }

    function afficherCollection() {
      $("objetsTotal").textContent = catalogueObjets.length;
      $("objetsTrouves").textContent = collection.length;

      $("collectionGrid").innerHTML = catalogueObjets.map(objet => {
        const trouve = collection.includes(objet.id);
        const nouveau = dernierObjetNouveau === objet.id;
        return `
          <div class="objet ${trouve ? "" : "inconnu"} ${nouveau ? "nouveau" : ""}">
            <div class="icone">${trouve ? objet.icone : "❓"}</div>
            <div class="nom">${trouve ? objet.nom : "Objet inconnu"}</div>
            <div class="rarete">${trouve ? objet.rarete : "À découvrir"}</div>
          </div>
        `;
      }).join("");
    }

    function mettreAJourBlocage() {
      stratesData.forEach((data, i) => {
        const wrapper = $(`wrapper-${i}`);
        if (!wrapper) return;

        wrapper.classList.toggle(
          "bloquee",
          data.decouverte || (activeStrateIndex !== null && activeStrateIndex !== i)
        );
      });
    }

    async function terminerPartie() {
      if (partieTerminee) return;

      partieTerminee = true;
      ticketActif = false;
      stratesData.forEach((_, i) => $(`canvas-${i}`)?.remove());

      if (gainTotal <= 0) {
        $("feedbackSonore").textContent = "Les fouilles sont terminées. Aucun trésor monétaire cette fois.";
        $("btnNouveauTicket").textContent = "Nouveau ticket · 1 🪙";
        $("btnNouveauTicket").disabled = false;
        return;
      }

      gainEnAttente = gainTotal;
      $("feedbackSonore").textContent = `⏳ Fouilles terminées : enregistrement de ${gainTotal} pièce(s) d’or…`;

      await crediterGainEnAttente();
    }

    async function crediterGainEnAttente() {
      if (transactionEnCours || gainEnAttente <= 0) return;

      transactionEnCours = true;
      $("btnNouveauTicket").disabled = true;

      try {
        await Village.or.recompenser(gainEnAttente, "Trésor des Âges", {
          animation: false,
          son: false,
          messageAttente: "Enregistrement du trésor…",
          messageSucces: `Bravo ! ${gainEnAttente} pièce(s) d’or ajoutée(s) à votre profil.`,
          details: {
            jeu: "tresor-des-ages",
            type: "gain-ticket"
          }
        });

        $("feedbackSonore").textContent = `🎉 Fouilles terminées : ${gainEnAttente} pièce(s) d’or remportée(s) et enregistrée(s).`;
        gainEnAttente = 0;
        $("btnNouveauTicket").textContent = "Nouveau ticket · 1 🪙";
      } catch (erreur) {
        console.warn("Crédit du gain impossible :", erreur);
        $("feedbackSonore").textContent = "⚠️ Gain non enregistré. Vérifiez la connexion puis réessayez.";
        $("btnNouveauTicket").textContent = "Réessayer l’enregistrement";
      } finally {
        transactionEnCours = false;
        $("btnNouveauTicket").disabled = false;
      }
    }

    async function acheterTicket() {
      if (transactionEnCours) return;

      if (!window.Village) {
        $("feedbackSonore").textContent = "⚠️ Le service du Village n’est pas disponible.";
        return;
      }

      const profil = Village.profil.lire();
      if (!profil) {
        Village.ui.erreur("Aucun profil actif. Retournez au Village pour choisir un joueur.", { duree: 5000 });
        $("feedbackSonore").textContent = "Choisissez d’abord un profil dans le Village.";
        return;
      }

      transactionEnCours = true;
      $("btnNouveauTicket").disabled = true;
      $("btnNouveauTicket").textContent = "Achat du ticket…";

      try {
        const resultat = await Village.or.depenser(1, "Trésor des Âges", {
          confirmer: false,
          messageSucces: "Ticket acheté : bonne fouille !",
          details: {
            jeu: "tresor-des-ages",
            type: "achat-ticket"
          }
        });

        if (resultat?.annule) return;
        creerTicket();
      } catch (erreur) {
        console.warn("Achat du ticket impossible :", erreur);
        $("feedbackSonore").textContent = erreur.message || "Le ticket n’a pas pu être acheté.";
        $("btnNouveauTicket").textContent = "Commencer les fouilles · 1 🪙";
        $("btnNouveauTicket").disabled = false;
      } finally {
        transactionEnCours = false;
      }
    }

    function preparerPremierTicket() {
      coupsRestants = 0;
      gainTotal = 0;
      partieTerminee = true;
      ticketActif = false;
      $("coupsRestants").textContent = "0";
      $("gainActuel").textContent = "0";
      $("gameContainer").innerHTML = `
        <div class="progression" style="text-align:center; padding:22px 14px;">
          Un ticket coûte <strong>1 pièce d’or</strong>.<br>
          Les gains seront ajoutés automatiquement à votre profil à la fin des fouilles.
        </div>
      `;
      $("feedbackSonore").textContent = "Appuyez sur le bouton pour commencer une nouvelle fouille.";
      $("btnNouveauTicket").textContent = "Commencer les fouilles · 1 🪙";
      $("btnNouveauTicket").disabled = false;
      afficherCollection();
    }

    $("btnNouveauTicket").addEventListener("click", async () => {
      if (gainEnAttente > 0) {
        await crediterGainEnAttente();
      } else {
        await acheterTicket();
      }
    });

    $("btnMusee").addEventListener("click", () => {
      $("musee").classList.toggle("ouvert");
      dernierObjetNouveau = null;
      afficherCollection();
    });

    $("btnFermerPopup").addEventListener("click", () => {
      $("popup").classList.remove("visible");
    });

    $("popup").addEventListener("click", (e) => {
      if (e.target === $("popup")) $("popup").classList.remove("visible");
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && $("popup").classList.contains("visible")) {
        $("popup").classList.remove("visible");
      }
    });

    $("btnResetCollection").addEventListener("click", () => {
      if (!confirm("Effacer tous les objets du musée sur cet appareil ?")) return;
      collection = [];
      dernierObjetNouveau = null;
      sauvegarderCollection();
      afficherCollection();
    });

    window.addEventListener("load", () => {
      if (window.Village) {
        Village.init({ debug: false });
      }
      preparerPremierTicket();
    });
  </script>
